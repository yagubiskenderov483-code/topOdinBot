    :root {

      --accent: #1a7fb0;
      --mint: #1f7a63;
      --amber: #c48a14;
      --danger: #c23b2a;
      --glass: rgba(255,255,255,0.72);
      --safe-top: env(safe-area-inset-top, 0px);

      --header-h: 0px;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--ink);

      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;

    body {

    .app {

      color: var(--mint);
      vertical-align: middle;

    .lead {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.35;
    }
    .stats {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .stat strong {
      display: block;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.3rem;
      letter-spacing: -0.03em;
    }
    .stat span { color: var(--muted); font-size: 0.72rem; font-weight: 600; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .filters button {
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font: 700 0.76rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .filters button.active {
      color: #fff;
      background: var(--accent);
      border-color: transparent;
    }
    .scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      padding: 4px 16px calc(18px + var(--safe-bottom));
    }
    .feed { display: flex; flex-direction: column; }
    .review {
      padding: 15px 0;
      border-top: 1px solid var(--line);
    }
    .review:first-child { border-top: 0; }
    .review.new { animation: popin .4s ease; }
    @keyframes popin {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .name {
      font-weight: 800;
      font-size: 0.94rem;
      max-width: 70%;
      overflow-wrap: anywhere;
    }
    .name.anon { color: var(--muted); font-style: italic; font-weight: 700; }
    .name.fancy { color: var(--accent); }
    .name.long {
      font-size: 0.82rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--mint);
    }
    .meta { color: var(--muted); font-size: 0.73rem; white-space: nowrap; }
    .stars {
      color: var(--amber);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }
    .stars.low { color: var(--danger); }
    .text {
      color: rgba(16, 42, 60, 0.92);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .tag {
      display: inline-block;
      margin-top: 8px;
      color: var(--mint);
      font-size: 0.72rem;
      font-weight: 700;
    }
    .more {
      margin: 12px 0 4px;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--accent);
      border-radius: 12px;
      padding: 12px 16px;
      font: 800 0.88rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .more[hidden] { display: none; }
    .status { color: var(--muted); font-size: 0.8rem; padding: 8px 0; }
    .foot {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }
    .foot a { color: var(--accent); text-decoration: none; font-weight: 700; }
  </style>
</head>

    var bh = (b >>> 16) & 65535, bl = b & 65535;
