  }

  function dayKey(p) {
    return p.y * 10000 + p.m * 100 + p.day;
  }

  function clampToToday(p) {
    var t = todayParts();
    var tk = dayKey(t);
    if (dayKey(p) > tk) return t;
    return p;
  }

  function formatParts(p, ru) {
    return MONTH_EN[p.m] + " " + p.day;
  }

  function withCalendarDate(review, idx) {
    var copy = {};
    for (var k in review) if (Object.prototype.hasOwnProperty.call(review, k)) copy[k] = review[k];
    var ru = /[а-яё]/i.test(String(review.text || "")) || /[а-яё]/i.test(String(review.name || ""));
    var p = clampToToday(parseReviewDay(review.date));
    // newly unlocked future rows always show as today
    if (idx != null) p = todayParts();
    copy.date = formatParts(p, ru);
    copy._day = dayKey(p);
    copy._fresh = idx == null ? 0 : (1000 - idx);
    return copy;
  }

  function sortByCalendar(list) {
    return list.slice().sort(function (a, b) {
      var db = (b._day || 0) - (a._day || 0);
      if (db !== 0) return db;
      return (Number(b._fresh) || 0) - (Number(a._fresh) || 0);
    });
  }

  function rebuildSource() {
    var next = unlockedCount(Date.now());
    var grown = future.slice(0, next).map(function (r, i) { return withCalendarDate(r, i); });
    var base = baseReviews.map(function (r) { return withCalendarDate(r, null); });
    source = sortByCalendar(grown.concat(base));
    // Fixed public stats (do not use source.length — feed is a sample)
    var avg = Number(data.average);
    if (!(avg > 0)) avg = 4.8;
    var shownCount = Number(data.displayCount);
    if (!(shownCount > 0)) shownCount = Number(data.count);
    if (!(shownCount > 0)) shownCount = 44728;
    document.getElementById("avgScore").textContent = String(avg);
    document.getElementById("reviewCount").textContent = String(shownCount);
    syncHeroCount();
    var prev = unlocked;
    unlocked = next;
    return Math.max(0, unlocked - prev);
  }

  function renderFilters() {
    var items = [["all","Все"],["5","5★"],["4","4★"],["low","1–3★"]];
    filtersEl.innerHTML = items.map(function (pair) {
      return '<button type="button" data-f="' + pair[0] + '" class="' +
        (activeFilter === pair[0] ? "active" : "") + '">' + pair[1] + "</button>";
    }).join("");
    var buttons = filtersEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].onclick = function () {
        activeFilter = this.getAttribute("data-f");
        applyFilter();
        renderFilters();
      };
    }
  }


  function filterDisplayTotal() {
    if (activeFilter === "all") return totalDisplay();
    if (activeFilter === "5") return Number(data.fiveDisplayCount) || 37500;
    if (activeFilter === "4") return Number(data.fourDisplayCount) || 6700;
    if (activeFilter === "low") return Number(data.lowDisplayCount) || 528;
    return filtered.length || 0;
  }

  function syncHeroCount() {
    var el = document.getElementById("reviewCount");
    if (!el) return;
    el.textContent = String(filterDisplayTotal());
  }

  function totalDisplay() {
    var n = Number(data.displayCount);
    if (!(n > 0)) n = Number(data.count);
    if (!(n > 0)) n = 44728;
    return n;
  }

  function applyFilter() {
    syncHeroCount();
    if (activeFilter === "all") filtered = source.slice();
    else if (activeFilter === "low") filtered = source.filter(function (r) { return r.stars <= 3; });
    else filtered = source.filter(function (r) { return String(r.stars) === activeFilter; });
    shown = 0;
    feed.innerHTML = "";
    renderBatch(0);
    try { scrollEl.scrollTop = 0; } catch (e) {}
  }

  function renderBatch(newCount) {
    var slice = filtered.slice(shown, shown + PAGE);
    var html = [];
    for (var i = 0; i < slice.length; i++) {
      var r = slice[i];
      var low = r.stars <= 2 ? " low" : "";
      var isNew = newCount && i < newCount && shown === 0 ? " new" : "";
      html.push(
        '<article class="review' + isNew + '">' +
          '<div class="review-top">' +
            '<div class="' + nameClass(r.name) + '">' + esc(r.name) + "</div>" +
            '<div class="meta">' + esc(r.date) + "</div>" +
          "</div>" +
          '<div class="stars' + low + '">' + starsHtml(r.stars) + "</div>" +
          '<p class="text">' + esc(r.text) + "</p>" +
          '<div class="tag">' + esc(r.tag) + "</div>" +
        "</article>"
      );
    }
    feed.insertAdjacentHTML("beforeend", html.join(""));
    shown += slice.length;
    // Fixed public totals per filter (feed is a sample)
    var total = filterDisplayTotal();
    if (shown > total) total = shown;
    loadMore.hidden = shown >= filtered.length;
    if (!filtered.length) loadStatus.textContent = "Пока нет отзывов в этом фильтре";
    else if (shown >= filtered.length) loadStatus.textContent = "Показано " + total + " из " + total;
    else loadStatus.textContent = "Показано " + Math.min(shown, total) + " из " + total;
  }

  function nextWakeDelay() {
    var now = Date.now();
    if (now < growthEpoch) return Math.min(60000, growthEpoch - now);
    var elapsed = now - growthEpoch;
    var w = Math.floor(elapsed / windowMs);
    var pos = elapsed % windowMs;
    var offs = offsetsForWindow(w, countForWindow(w));
    for (var i = 0; i < offs.length; i++) if (offs[i] > pos) return Math.min(60000, offs[i] - pos + 50);
    return Math.min(60000, windowMs - pos + 50);
  }

  function scheduleGrowth() {
    var added = rebuildSource();
    if (added > 0) applyFilter();
    setTimeout(scheduleGrowth, nextWakeDelay());
  }

  // Prevent Telegram from collapsing Mini App on upward swipe / overscroll
  function lockTelegramGestures() {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      tg.expand();
      if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor("#d8eef9");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#d8eef9");
      if (typeof tg.onEvent === "function") {
        tg.onEvent("viewportChanged", function () {
          try { tg.expand(); } catch (e) {}
        });
      }
      // keep expanded
      setInterval(function () {
        try {
          if (!tg.isExpanded) tg.expand();
          if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
        } catch (e) {}
      }, 1200);
    } catch (e) {}
  }

  // Stop pull-to-dismiss when scroll is at top
  (function blockOverscrollCollapse() {
    var startY = 0;
    scrollEl.addEventListener("touchstart", function (e) {
      if (e.touches && e.touches.length) startY = e.touches[0].clientY;
    }, { passive: true });
    scrollEl.addEventListener("touchmove", function (e) {
      if (!e.touches || !e.touches.length) return;
      var dy = e.touches[0].clientY - startY;
      // dragging down while already at top -> prevent parent/Telegram gesture
      if (dy > 0 && scrollEl.scrollTop <= 0) {
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  })();

  function boot() {
    try {
      rebuildSource();
      renderFilters();
      applyFilter();
      if (!source.length) loadStatus.textContent = "Отзывы не найдены";
      scheduleGrowth();
    } catch (e) {
      loadStatus.textContent = "Ошибка загрузки отзывов";
    }
  }

  loadMore.onclick = function () { renderBatch(0); };
  lockTelegramGestures();
  boot();
})();
  </script>
</body>
