    .stats {

      gap: 10px;

    .stat {

      padding: 10px 12px;
    }
    .stat strong {

      font-size: 1.3rem;
      letter-spacing: -0.03em;

    .stat span { color: var(--muted); font-size: 0.72rem; font-weight: 600; }
    .filters {

      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

      background: var(--glass);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font: 700 0.76rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .filters button.active {
      color: #fff;
      background: var(--accent);
      border-color: transparent;
    }
    .scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      padding: 4px 16px calc(18px + var(--safe-bottom));
    }
    .feed { display: flex; flex-direction: column; }
    .review {
      padding: 15px 0;
      border-top: 1px solid var(--line);
    }
    .review:first-child { border-top: 0; }
    .review.new { animation: popin .4s ease; }
    @keyframes popin {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .name {
      font-weight: 800;
      font-size: 0.94rem;
      max-width: 70%;
      overflow-wrap: anywhere;
    }
    .name.anon { color: var(--muted); font-style: italic; font-weight: 700; }
    .name.fancy { color: var(--accent); }
    .name.long {

    .meta { color: var(--muted); font-size: 0.73rem; white-space: nowrap; }
    .stars {

      margin-bottom: 6px;
      font-size: 0.88rem;

    .tag {

      font-size: 0.72rem;

    .status { color: var(--muted); font-size: 0.8rem; padding: 8px 0; }
    .foot {

      // keep expanded
      setInterval(function () {
        try {
          if (!tg.isExpanded) tg.expand();
          if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
        } catch (e) {}
      }, 1200);
    } catch (e) {}
  }

  // Stop pull-to-dismiss when scroll is at top
  (function blockOverscrollCollapse() {
    var startY = 0;
    scrollEl.addEventListener("touchstart", function (e) {
      if (e.touches && e.touches.length) startY = e.touches[0].clientY;
    }, { passive: true });
    scrollEl.addEventListener("touchmove", function (e) {
      if (!e.touches || !e.touches.length) return;
      var dy = e.touches[0].clientY - startY;
      // dragging down while already at top -> prevent parent/Telegram gesture
      if (dy > 0 && scrollEl.scrollTop <= 0) {
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  })();

  function boot() {
    try {
      rebuildSource();
      renderFilters();
      applyFilter();
      if (!source.length) loadStatus.textContent = "Отзывы не найдены";
      scheduleGrowth();
    } catch (e) {
      loadStatus.textContent = "Ошибка загрузки отзывов";
    }
  }

  loadMore.onclick = function () { renderBatch(0); };
  lockTelegramGestures();
  boot();
})();
  </script>
</body>
</html>
