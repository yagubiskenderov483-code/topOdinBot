  }

  function totalDisplay() {
    var n = Number(data.displayCount);
    if (!(n > 0)) n = Number(data.count);
    if (!(n > 0)) n = 44728;
    return n;
  }

  function applyFilter() {
    syncHeroCount();
    if (activeFilter === "all") filtered = source.slice();
    else if (activeFilter === "low") filtered = source.filter(function (r) { return r.stars <= 3; });
    else filtered = source.filter(function (r) { return String(r.stars) === activeFilter; });
    shown = 0;
    feed.innerHTML = "";
    renderBatch(0);
    try { scrollEl.scrollTop = 0; } catch (e) {}
  }

  function renderBatch(newCount) {
    var slice = filtered.slice(shown, shown + PAGE);
    var html = [];
    for (var i = 0; i < slice.length; i++) {
      var r = slice[i];
      var low = r.stars <= 2 ? " low" : "";
      var isNew = newCount && i < newCount && shown === 0 ? " new" : "";
      html.push(
        '<article class="review' + isNew + '">' +
          '<div class="review-top">' +
            '<div class="' + nameClass(r.name) + '">' + esc(r.name) + "</div>" +
            '<div class="meta">' + esc(r.date) + "</div>" +
          "</div>" +
          '<div class="stars' + low + '">' + starsHtml(r.stars) + "</div>" +
          '<p class="text">' + esc(r.text) + "</p>" +
          '<div class="tag">' + esc(r.tag) + "</div>" +
        "</article>"
      );
    }
    feed.insertAdjacentHTML("beforeend", html.join(""));
    shown += slice.length;
    // Fixed public totals per filter (feed is a sample)
    var total = filterDisplayTotal();
    if (shown > total) total = shown;
    loadMore.hidden = shown >= filtered.length;
    if (!filtered.length) loadStatus.textContent = "Пока нет отзывов в этом фильтре";
    else if (shown >= filtered.length) loadStatus.textContent = "Показано " + total + " из " + total;
    else loadStatus.textContent = "Показано " + Math.min(shown, total) + " из " + total;
  }

  function nextWakeDelay() {
    var now = Date.now();
    if (now < growthEpoch) return Math.min(60000, growthEpoch - now);
    var elapsed = now - growthEpoch;
    var w = Math.floor(elapsed / windowMs);
    var pos = elapsed % windowMs;
    var offs = offsetsForWindow(w, countForWindow(w));
    for (var i = 0; i < offs.length; i++) if (offs[i] > pos) return Math.min(60000, offs[i] - pos + 50);
    return Math.min(60000, windowMs - pos + 50);
  }

  function scheduleGrowth() {
    var added = rebuildSource();
    if (added > 0) applyFilter();
    setTimeout(scheduleGrowth, nextWakeDelay());
  }

  // Prevent Telegram from collapsing Mini App on upward swipe / overscroll
  function lockTelegramGestures() {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      tg.expand();
      if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor("#d8eef9");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#d8eef9");
      if (typeof tg.onEvent === "function") {
        tg.onEvent("viewportChanged", function () {
          try { tg.expand(); } catch (e) {}
        });
      }
      // keep expanded
      setInterval(function () {
        try {
          if (!tg.isExpanded) tg.expand();
          if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
        } catch (e) {}
      }, 1200);
    } catch (e) {}
  }

  // Stop pull-to-dismiss when scroll is at top
  (function blockOverscrollCollapse() {
    var startY = 0;
    scrollEl.addEventListener("touchstart", function (e) {
      if (e.touches && e.touches.length) startY = e.touches[0].clientY;
    }, { passive: true });
    scrollEl.addEventListener("touchmove", function (e) {
      if (!e.touches || !e.touches.length) return;
      var dy = e.touches[0].clientY - startY;
      // dragging down while already at top -> prevent parent/Telegram gesture
      if (dy > 0 && scrollEl.scrollTop <= 0) {
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  })();

  function boot() {
    try {
      rebuildSource();
      renderFilters();
      applyFilter();
      if (!source.length) loadStatus.textContent = "Отзывы не найдены";
      scheduleGrowth();
    } catch (e) {
      loadStatus.textContent = "Ошибка загрузки отзывов";
    }
  }

  loadMore.onclick = function () { renderBatch(0); };
  lockTelegramGestures();
  boot();
})();
  </script>
</body>
</html>
