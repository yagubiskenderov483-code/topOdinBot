    :root {

      --amber: #f0c56d;

      --danger: #ff8b7a;

    html, body {

      pointer-events: none !important;
      opacity: 0 !important;
    }
    .shell {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: calc(12px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    }
    .top {
      padding: 4px 0 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }
    .brand {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 1.85rem;
      line-height: 1;
      letter-spacing: -0.04em;

    .brand em { font-style: normal; color: var(--amber-soft); }
    .brand small {

      margin-left: 8px;
      font-size: 0.42em;
      letter-spacing: 0.22em;
      color: var(--mint);
      vertical-align: middle;
      font-weight: 700;
    }
    .lead {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .stats {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat strong {
      display: block;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }
    .stat span { color: var(--muted); font-size: 0.75rem; font-weight: 600; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 6px;
    }
    .filters button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 12px;
      font: 700 0.78rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .filters button.active {
      color: #102018;
      background: var(--mint);
      border-color: transparent;
    }
    .feed { display: flex; flex-direction: column; }
    .review {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .review.new {
      animation: popin .45s ease;
    }
    @keyframes popin {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }
    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .name {
      font-weight: 800;
      font-size: 0.95rem;
      max-width: 70%;
      overflow-wrap: anywhere;
    }
    .name.anon { color: var(--muted); font-style: italic; font-weight: 700; }
    .name.fancy { color: var(--amber-soft); }
    .name.long {
      font-size: 0.84rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--mint);
    }
    .meta { color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
    .stars {
      color: var(--amber);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    .stars.low { color: var(--danger); }
    .text {
      color: rgba(238, 247, 244, 0.9);
      font-size: 0.93rem;
      line-height: 1.45;
    }
    .tag {
      display: inline-block;
      margin-top: 8px;
      color: var(--mint);
      font-size: 0.74rem;
      font-weight: 700;
    }
    .more {
      margin: 14px 0 6px;
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(16, 42, 56, 0.55);
      color: var(--amber-soft);
      border-radius: 12px;
      padding: 12px 16px;
      font: 800 0.9rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .more[hidden] { display: none; }
    .status { color: var(--muted); font-size: 0.82rem; padding: 8px 0; }
    .foot {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .foot a { color: var(--amber-soft); text-decoration: none; font-weight: 700; }
  </style>
</head>

(function () {
  var PAGE = 30;
  var source = [];
  var filtered = [];
  var shown = 0;
  var unlocked = 0;
  var activeFilter = "all";
  var data = window.REVIEWS_DATA || {};
  var baseReviews = Array.isArray(data.reviews) ? data.reviews.slice() : [];
  var future = Array.isArray(data.future) ? data.future.slice() : [];
  var growthEpoch = Number(data.growthEpochMs) || Date.now();
  var windowMs = Number(data.windowMs) || (3 * 60 * 60 * 1000);
  var ANON = {
    "Аноним": 1, "Anonymous": 1, "скрытый ник": 1,
    "Анонимный": 1, "Hidden user": 1, "без ника": 1
  };

  var feed = document.getElementById("feed");
  var loadMore = document.getElementById("loadMore");
  var loadStatus = document.getElementById("loadStatus");
  var filtersEl = document.getElementById("filters");

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function starsHtml(n) {
    n = Number(n) || 0;
    if (n < 0) n = 0;
    if (n > 5) n = 5;
    return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
  }

  function nameClass(name) {
    if (ANON[name]) return "name anon";
    if (name.length > 18 || name.indexOf("_") !== -1) return "name long";
    for (var i = 0; i < name.length; i++) {
      if (name.charCodeAt(i) > 1000 && /[^\u0400-\u04FF]/.test(name.charAt(i))) {
        return "name fancy";
      }
    }
    return "name";
  }

  function hash32(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // Usually 4 per 3h window, sometimes 3 or 2
  function countForWindow(w) {
    var r = hash32(String(growthEpoch) + ":n:" + w) % 10;
    if (r < 2) return 2;
    if (r < 5) return 3;
    return 4;
  }

  function offsetsForWindow(w, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var h = hash32(String(growthEpoch) + ":t:" + w + ":" + i);
      out.push(h % windowMs);
    }
    out.sort(function (a, b) { return a - b; });
    return out;
  }

  function unlockedCount(now) {
    if (!future.length) return 0;
    if (now < growthEpoch) return 0;
    var elapsed = now - growthEpoch;
    var w = Math.floor(elapsed / windowMs);
    var pos = elapsed % windowMs;
    var total = 0;
    for (var i = 0; i < w; i++) total += countForWindow(i);
    var curN = countForWindow(w);
    var offs = offsetsForWindow(w, curN);
    for (var j = 0; j < offs.length; j++) {
      if (offs[j] <= pos) total += 1;
    }
    if (total > future.length) total = future.length;
    return total;
  }

  function rebuildSource(markNewFrom) {
    var now = Date.now();
    var next = unlockedCount(now);
    var grown = future.slice(0, next);
    // newest grown first
    source = grown.slice().reverse().concat(baseReviews);
    var avg = 0;
    for (var i = 0; i < source.length; i++) avg += Number(source[i].stars) || 0;
    avg = source.length ? Math.round((avg / source.length) * 10) / 10 : 0;
    document.getElementById("avgScore").textContent = String(avg);
    document.getElementById("reviewCount").textContent = String(source.length);
    var prev = unlocked;
    unlocked = next;
    return { added: Math.max(0, unlocked - prev), markNewFrom: markNewFrom ? grown.length - (unlocked - prev) : -1 };
  }

  function renderFilters() {
    var items = [
      ["all", "Все"],
      ["5", "5★"],
      ["4", "4★"],
      ["low", "1–3★"]
    ];
    filtersEl.innerHTML = items.map(function (pair) {
      var id = pair[0], label = pair[1];
      return '<button type="button" data-f="' + id + '" class="' +
        (activeFilter === id ? "active" : "") + '">' + label + "</button>";
    }).join("");
    var buttons = filtersEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].onclick = function () {
        activeFilter = this.getAttribute("data-f");
        applyFilter(false);
        renderFilters();
      };
    }
  }

  function applyFilter(keepScroll) {
    if (activeFilter === "all") filtered = source.slice();
    else if (activeFilter === "low") {
      filtered = source.filter(function (r) { return r.stars <= 3; });
    } else {
      filtered = source.filter(function (r) { return String(r.stars) === activeFilter; });
    }
    shown = 0;
    feed.innerHTML = "";
    renderBatch(0);
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function renderBatch(newCount) {
    var slice = filtered.slice(shown, shown + PAGE);
    var html = [];
    for (var i = 0; i < slice.length; i++) {
      var r = slice[i];
      var low = r.stars <= 2 ? " low" : "";
      var isNew = newCount && i < newCount && shown === 0 ? " new" : "";
      html.push(
        '<article class="review' + isNew + '">' +
          '<div class="review-top">' +
            '<div class="' + nameClass(r.name) + '">' + esc(r.name) + "</div>" +
            '<div class="meta">' + esc(r.date) + "</div>" +
          "</div>" +
          '<div class="stars' + low + '" aria-label="' + r.stars + ' / 5">' + starsHtml(r.stars) + "</div>" +
          '<p class="text">' + esc(r.text) + "</p>" +
          '<div class="tag">' + esc(r.tag) + "</div>" +
        "</article>"
      );
    }
    feed.insertAdjacentHTML("beforeend", html.join(""));
    shown += slice.length;
    loadMore.hidden = shown >= filtered.length;
    if (!filtered.length) loadStatus.textContent = "Пока нет отзывов в этом фильтре";
    else if (shown >= filtered.length) loadStatus.textContent = "Показаны все " + filtered.length;
    else loadStatus.textContent = "Показано " + shown + " из " + filtered.length;
  }

  function refreshGrowth() {
    var info = rebuildSource(true);
    if (info.added > 0 && activeFilter === "all") {
      // prepend newly unlocked reviews without full reset of scrolled content when possible
      applyFilter(true);
    } else if (info.added > 0) {
      rebuildSource(false);
      document.getElementById("reviewCount").textContent = String(source.length);
    }
  }

  function nextWakeDelay() {
    var now = Date.now();
    if (now < growthEpoch) return Math.min(60000, growthEpoch - now);
    var elapsed = now - growthEpoch;
    var w = Math.floor(elapsed / windowMs);
    var pos = elapsed % windowMs;
    var n = countForWindow(w);
    var offs = offsetsForWindow(w, n);
    for (var i = 0; i < offs.length; i++) {
      if (offs[i] > pos) return Math.min(60000, offs[i] - pos + 50);
    }
    return Math.min(60000, windowMs - pos + 50);
  }

  function scheduleGrowth() {
    refreshGrowth();
    setTimeout(scheduleGrowth, nextWakeDelay());
  }

  function killBrewChrome() {
    try {
      var nodes = document.querySelectorAll("body *");
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        if (el.closest && el.closest(".shell")) continue;
        var t = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (!t || t.length > 220) continue;
        if (/Hosted on BrewPage|Report abuse|EXPIRES|brewpage\.app|BrewPage/i.test(t)) {
          var node = el;
          for (var up = 0; up < 5 && node.parentElement && node.parentElement !== document.body; up++) {
            node = node.parentElement;
          }
          if (node && node !== document.body && !(node.classList && node.classList.contains("shell"))) {
            node.style.setProperty("display", "none", "important");
            node.style.setProperty("visibility", "hidden", "important");
            try { node.remove(); } catch (e) {}
          }
        }
      }
    } catch (e) {}
  }

  function boot() {
    try {
      rebuildSource(false);
      renderFilters();
      applyFilter(false);
      if (!source.length) loadStatus.textContent = "Отзывы не найдены";
      scheduleGrowth();
      killBrewChrome();
      setInterval(killBrewChrome, 800);
      try {
        new MutationObserver(killBrewChrome).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}
    } catch (e) {
      loadStatus.textContent = "Ошибка загрузки отзывов";
    }
  }

  loadMore.onclick = function () { renderBatch(0); };

  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#07131a");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#07131a");
    }
  } catch (e) {}

  boot();
})();
  </script>
</body>
