    :root {

    .shell {
      width: min(100%, 480px);

      padding: calc(12px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));

    .top {
      padding: 4px 0 14px;

    .brand {

      font-weight: 800;
      font-size: 1.85rem;
      line-height: 1;
      letter-spacing: -0.04em;

    .brand em { font-style: normal; color: var(--amber-soft); }
    .brand small {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.42em;
      letter-spacing: 0.22em;
      color: var(--mint);
      vertical-align: middle;
      font-weight: 700;
    }
    .lead {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .stats {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat strong {
      display: block;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }
    .stat span { color: var(--muted); font-size: 0.75rem; font-weight: 600; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 6px;
    }
    .filters button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 12px;
      font: 700 0.78rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .filters button.active {
      color: #102018;
      background: var(--mint);
      border-color: transparent;
    }
    .feed { display: flex; flex-direction: column; }
    .review {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .name {
      font-weight: 800;
      font-size: 0.95rem;
      max-width: 70%;
      overflow-wrap: anywhere;
    }
    .name.anon { color: var(--muted); font-style: italic; font-weight: 700; }
    .name.fancy { color: var(--amber-soft); }
    .name.long {
      font-size: 0.84rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--mint);
    }
    .meta { color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
    .stars {
      color: var(--amber);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    .stars.low { color: var(--danger); }
    .text {
      color: rgba(238, 247, 244, 0.9);
      font-size: 0.93rem;
      line-height: 1.45;
    }
    .tag {
      display: inline-block;
      margin-top: 8px;
      color: var(--mint);
      font-size: 0.74rem;
      font-weight: 700;
    }
    .more {
      margin: 14px 0 6px;
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(16, 42, 56, 0.55);
      color: var(--amber-soft);
      border-radius: 12px;
      padding: 12px 16px;
      font: 800 0.9rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .more[hidden] { display: none; }
    .status { color: var(--muted); font-size: 0.82rem; padding: 8px 0; }
    .foot {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .foot a { color: var(--amber-soft); text-decoration: none; font-weight: 700; }
  </style>
</head>

    // fancy unicode nicknames usually have chars outside BMP / special ranges
    for (var i = 0; i < name.length; i++) {
      if (name.charCodeAt(i) > 1000 && /[^\u0400-\u04FF]/.test(name.charAt(i))) {
        return "name fancy";
      }
    }
    return "name";
  }

  function renderFilters() {
    var items = [
      ["all", "Все"],
      ["5", "5★"],
      ["4", "4★"],
      ["low", "1–3★"]
    ];
    filtersEl.innerHTML = items.map(function (pair) {
      var id = pair[0], label = pair[1];
      return '<button type="button" data-f="' + id + '" class="' +
        (activeFilter === id ? "active" : "") + '">' + label + "</button>";
    }).join("");
    var buttons = filtersEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].onclick = function () {
        activeFilter = this.getAttribute("data-f");
        applyFilter();
        renderFilters();
      };
    }
  }

  function applyFilter() {
    if (activeFilter === "all") filtered = source.slice();
    else if (activeFilter === "low") {
      filtered = source.filter(function (r) { return r.stars <= 3; });
    } else {
      filtered = source.filter(function (r) { return String(r.stars) === activeFilter; });
    }
    shown = 0;
    feed.innerHTML = "";
    renderBatch();
  }

  function renderBatch() {
    var slice = filtered.slice(shown, shown + PAGE);
    var html = [];
    for (var i = 0; i < slice.length; i++) {
      var r = slice[i];
      var low = r.stars <= 2 ? " low" : "";
      html.push(
        '<article class="review">' +
          '<div class="review-top">' +
            '<div class="' + nameClass(r.name) + '">' + esc(r.name) + "</div>" +
            '<div class="meta">' + esc(r.date) + "</div>" +
          "</div>" +
          '<div class="stars' + low + '" aria-label="' + r.stars + ' / 5">' + starsHtml(r.stars) + "</div>" +
          '<p class="text">' + esc(r.text) + "</p>" +
          '<div class="tag">' + esc(r.tag) + "</div>" +
        "</article>"
      );
    }
    feed.insertAdjacentHTML("beforeend", html.join(""));
    shown += slice.length;
    loadMore.hidden = shown >= filtered.length;
    if (!filtered.length) loadStatus.textContent = "Пока нет отзывов в этом фильтре";
    else if (shown >= filtered.length) loadStatus.textContent = "Показаны все " + filtered.length;
    else loadStatus.textContent = "Показано " + shown + " из " + filtered.length;
  }

  function boot() {
    try {
      var data = window.REVIEWS_DATA || {};
      source = Array.isArray(data.reviews) ? data.reviews.slice() : [];
      document.getElementById("avgScore").textContent = String(data.average != null ? data.average : "—");
      document.getElementById("reviewCount").textContent = String(data.count != null ? data.count : source.length);
      renderFilters();
      applyFilter();
      if (!source.length) loadStatus.textContent = "Отзывы не найдены";
    } catch (e) {
      loadStatus.textContent = "Ошибка загрузки отзывов";
    }
  }

  loadMore.onclick = renderBatch;

  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#07131a");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#07131a");
    }
  } catch (e) {}

  boot();
})();
  </script>
</body>
</html>
