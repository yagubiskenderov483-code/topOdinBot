      border-radius: 999px;
      padding: 8px 12px;
      font: 700 0.76rem "Manrope", sans-serif;
      cursor: pointer;
    }
    .filters button.active {
      color: #fff;
      background: var(--accent);
      border-color: transparent;
    }
    .scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      padding: 4px 16px calc(18px + var(--safe-bottom));
    }
    .feed { display: flex; flex-direction: column; }
    .review {
      padding: 15px 0;
      border-top: 1px solid var(--line);
    }
    .review:first-child { border-top: 0; }
    .review.new { animation: popin .4s ease; }
    @keyframes popin {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .name {
      font-weight: 800;
      font-size: 0.94rem;
      max-width: 70%;
      overflow-wrap: anywhere;
    }
    .name.anon { color: var(--muted); font-style: italic; font-weight: 700; }
    .name.fancy { color: var(--accent); }
    .name.long {

    .stars {

      margin-bottom: 6px;

      font-weight: 700;

    .more {

      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--accent);
      border-radius: 12px;
      padding: 12px 16px;
      font: 800 0.88rem "Manrope", sans-serif;
      cursor: pointer;

    .status { color: var(--muted); font-size: 0.8rem; padding: 8px 0; }
    .foot {

      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }
