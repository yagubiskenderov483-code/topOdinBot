services:
  - type: web
    name: funpay-saving-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    disk:
      name: funpay-saving-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_FILE
        value: /data/db.json
      - key: DATA_DIR
        value: /data
      - key: RENDER_KEEPALIVE
        value: "1"
      - key: KEEPALIVE_INTERVAL_SEC
        value: "480"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: USE_WEBHOOK
        value: "1"

  - type: web
    name: funpay-reviews-miniapp
    runtime: static
    buildCommand: python3 miniapp/build.py
    staticPublishPath: miniapp
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /reviews
        destination: /index.html
      - type: rewrite
        source: /reviews.html
        destination: /index.html
