# Render Blueprint - один web-сервис: Mini App + /health (бот работает на Bothost, polling)
# Деплой: https://render.com/deploy?repo=https://github.com/yagubiskenderov483-code/topOdinBot
services:
  - type: web
    name: funpay-saving-bot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    repo: https://github.com/yagubiskenderov483-code/topOdinBot
    buildCommand: pip install -r requirements.txt && python3 miniapp/build.py
    startCommand: bash start_render.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://funpay-saving-bot.onrender.com
      - key: BOT_MODE
        value: miniapp
      - key: USE_WEBHOOK
        value: "0"
      - key: RENDER_KEEPALIVE
        value: "1"
      - key: KEEPALIVE_INTERVAL_SEC
        value: "480"
      - key: PYTHON_VERSION
        value: "3.11.0"
