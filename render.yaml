services:
  # Единственный сервис: бот + webhook + Mini Apps (отзывы /index.html, Tonkeeper /tonconnect.html)
  - type: web
    name: funpay-saving-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python3 miniapp/build.py
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://funpay-saving-bot.onrender.com
      - key: RENDER_KEEPALIVE
        value: "1"
      - key: KEEPALIVE_INTERVAL_SEC
        value: "480"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: USE_WEBHOOK
        value: "1"
